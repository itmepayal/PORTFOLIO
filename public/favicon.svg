<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Payal Yadav">
  <defs>
    <linearGradient id="py-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4355e8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Sharp brutalist tile -->
  <rect width="64" height="64" fill="#0f172a"/>

  <!-- Corner accents (matches portfolio cards) -->
  <path d="M0 0 H14 V2 H2 V14 H0 Z" fill="#4355e8"/>
  <path d="M64 64 H50 V62 H62 V50 H64 Z" fill="#4355e8" opacity="0.85"/>

  <!-- Subtle grid -->
  <path d="M0 32 H64 M32 0 V64" stroke="#4355e8" stroke-width="0.5" opacity="0.12"/>

  <!-- PY monogram -->
  <text
    x="32"
    y="41"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="24"
    font-weight="800"
    letter-spacing="-1"
    fill="url(#py-grad)"
  >PY</text>

  <text
    x="50"
    y="54"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="14"
    font-weight="600"
    fill="#4355e8"
  >.</text>
</svg>
